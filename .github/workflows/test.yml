name: Offline skill checks
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install click==8.1.8 pycryptodome==3.23.0 zstandard==0.25.0
      - name: Install pinned upstream for synthetic integration tests
        run: python skills/wechat-records/scripts/wechat.py install
      - run: python -m unittest discover -s tests -v
      - run: python tools/build_release.py
